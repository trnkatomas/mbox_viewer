<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Sign in · MBox Viewer</title>
    {% if tailwind_css %}<link rel="stylesheet" href="/static/vendor/tailwind.css">{% else %}<script src="https://cdn.tailwindcss.com"></script>{% endif %}
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-sm bg-white rounded-2xl shadow-md border border-gray-200 p-8">
        <h1 class="text-2xl font-extrabold text-blue-600 mb-1">MBox Viewer</h1>
        <p class="text-sm text-gray-500 mb-6">Sign in to read the archive.</p>
        {% if error %}
        <p role="alert" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login" class="space-y-4">
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input id="password" name="password" type="password" required autofocus
                       autocomplete="current-password"
                       class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Sign in</button>
        </form>
        {% if ca_available %}
        <p class="mt-6 text-xs text-gray-500">
            Browser warning about the certificate? Install
            <a href="/tls/ca.pem" class="text-blue-600 underline">this viewer's certificate authority</a>
            on your device once to trust it.
        </p>
        {% endif %}
    </main>
</body>
</html>
