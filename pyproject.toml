[project]
name = "mbox-viewer"
version = "0.1.0"
description = "A web-based email viewer for MBOX archives with full-text search, threading, and RAG-powered semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dateparser>=1.2.2",
    "duckdb>=1.4.1",
    "fastapi>=0.119.0",
    "jinja2>=3.1.6",
    "mcp[cli]>=1.0.0",
    "nh3>=0.3.7",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "python-multipart>=0.0.20",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "ipython>=8.37.0",
    "isort>=7.0.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "types-requests>=2.0.0",
]

[tool.mypy]
strict = false

[[tool.mypy.overrides]]
module = "ollama"
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "tests/*",
]
