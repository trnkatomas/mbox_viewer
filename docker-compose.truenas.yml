# TrueNAS Community Edition: Apps -> Discover Apps -> ⋮ -> Install via YAML.
# Paste this file, then replace every /mnt/POOL/... path below.
#
# TrueNAS runs this file as written, so there is no .env file and no ${VAR}
# substitution: all values are literal. See DOCKER_SETUP.md ("Running on
# TrueNAS") for the dataset and permission steps.
#
# Before the first install, create two datasets:
#   /mnt/POOL/mail          holds the mbox files; the apps user (568) needs read access
#   /mnt/POOL/apps/mbox     holds the indexes; the apps user (568) needs write access
#
# Every *.mbox file in the mail dataset (including subfolders) becomes a mailbox
# you can pick from the Mailbox menu in the viewer, each with its own index file
# in the index dataset. After adding a file, restart the app to index it.

name: mbox-viewer

services:
  # Brings every mailbox's index up to date, then exits. The first run indexes
  # everything; later runs only read messages appended since, rebuild an index
  # whose mbox was replaced, and index newly added mbox files.
  indexer:
    image: ghcr.io/trnkatomas/mbox_viewer:latest
    # Creates the session key and HTTPS certificates (the viewer's index mount is
    # read-only), then indexes
    command: ["sh", "-c", "python web_security.py init && python email_utils.py index --rebuild-if-stale"]
    user: "568:568"
    environment:
      MBOX_DIR: /data/mbox
      INDEX_DIR: /data/index
      STATE_DIR: /data/index/state
      # The names/IPs you open the viewer by; the HTTPS certificate covers these
      ALLOWED_HOSTS: "truenas.local,192.168.1.10"
      # off: no semantic (rag:) search. Set to auto after enabling Ollama below.
      INDEX_EMBEDDINGS: "off"
      OLLAMA_URL: http://ollama:11434/api/embed
      OLLAMA_MODEL: embeddinggemma
    volumes:
      - /mnt/POOL/mail:/data/mbox:ro
      - /mnt/POOL/apps/mbox:/data/index
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    # Uncomment together with the ollama service:
    # depends_on:
    #   ollama:
    #     condition: service_healthy

  viewer:
    image: ghcr.io/trnkatomas/mbox_viewer:latest
    user: "568:568"
    environment:
      MBOX_DIR: /data/mbox
      INDEX_DIR: /data/index
      STATE_DIR: /data/index/state
      # Same value as in the indexer above
      ALLOWED_HOSTS: "truenas.local,192.168.1.10"
      # From: docker run --rm -it ghcr.io/trnkatomas/mbox_viewer:latest python web_security.py hash-password
      MBOX_VIEWER_PASSWORD_HASH: "REPLACE_WITH_PASSWORD_HASH"
      OLLAMA_URL: http://ollama:11434/api/embed
    volumes:
      - /mnt/POOL/mail:/data/mbox:ro
      - /mnt/POOL/apps/mbox:/data/index:ro
    # https://<one of ALLOWED_HOSTS>:8000, with a login. The certificate is
    # self-signed: trust https://<host>:8000/tls/ca.pem on your devices once to
    # avoid the browser warning (DOCKER_SETUP.md, "HTTPS and login").
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      indexer:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional: semantic (rag:) search. Embedding a large mailbox on a CPU-only
  # NAS takes hours; you can enable this later and only missing embeddings
  # are computed. To enable: uncomment this service, the indexer's
  # depends_on, and set INDEX_EMBEDDINGS to auto.
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   environment:
  #     OLLAMA_HOST: 0.0.0.0
  #   volumes:
  #     - /mnt/POOL/apps/ollama:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #   restart: unless-stopped
